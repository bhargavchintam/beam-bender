name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install panda3d pytest -r requirements.txt
      - name: Run the unit tests
        run: python -m pytest
      # The game has no headless flag, so start it in a virtual display
      # (xvfb) with audio off, turn one mirror and render a few frames.
      - name: Start the game for a few frames (virtual display, no audio)
        run: |
          xvfb-run -a python -c "
          from panda3d.core import loadPrcFileData
          loadPrcFileData('', 'audio-library-name null')
          from beam_bender import BeamBender
          game = BeamBender()
          game.rotateSelected()
          for _ in range(5):
              game.taskMgr.step()
          print('beam-bender started and rendered 5 frames')
          "
